# checkup-brief — CI
# 只做健康科普，不做诊断，不能替代医生。
# 每次 push / PR：语法检查 + 单元测试 + 示例文件是否和代码一致 + 不许提交真实报告。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: for f in src/*.js web/app.js bin/*.js; do node --check "$f"; done

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Examples are up to date
        run: |
          node bin/checkup-brief.js examples/sample-report.txt --age 32 --sex male --budget 1500 > /tmp/brief.md
          node bin/checkup-brief.js examples/sample-report.txt --json > /tmp/report.json
          diff -u examples/sample-brief.md /tmp/brief.md
          diff -u examples/sample-report.json /tmp/report.json

      - name: No real report files tracked
        run: |
          if git ls-files | grep -Ei '(体检|报告|report).*\.(pdf|png|jpg|jpeg|heic)$'; then
            echo 'Real report files must not be tracked. Use examples/ sample data only.'
            exit 1
          fi
